[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mis-types = { path = "crates/mis-types" }
mis-agent = { path = "crates/mis-agent" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
if-addrs = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1.8"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Web Push encryption (RFC 8291 aes128gcm) on RustCrypto; builds requests, sends nothing,
# so reqwest stays the only HTTP/TLS stack. VAPID is signed with jsonwebtoken. Pinned: crypto.
web-push-native = { version = "=0.5.0", default-features = false }
base64ct = { version = "1.8", features = ["alloc"] }
